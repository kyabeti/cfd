<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluent時系列可視化レポート — 容器内混合デモ</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --sub: #5a6472;
    --line: #d9dee6; --accent: #0b66c3; --warn: #b35c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1a212b; --ink: #e8ecf2; --sub: #9aa6b5;
      --line: #303a48; --accent: #5aa2e8; --warn: #e0a050;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Segoe UI", "Yu Gothic UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .meta { color: var(--sub); font-size: .85rem; margin-bottom: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer;
    font-size: .85rem; }
  .tabs button.active { border-color: var(--accent); color: var(--accent);
    font-weight: 600; }
  .tabs button.unmatched { opacity: .45; text-decoration: line-through; }
  .stage { background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; }
  .imgbox { position: relative; text-align: center; }
  #frame-img { max-width: 100%; height: auto; border-radius: 8px;
    background: #000; min-height: 200px; }
  #missing { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; color: var(--warn); font-weight: 600;
    background: color-mix(in srgb, var(--card) 70%, transparent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 10px; }
  #slider { flex: 1; min-width: 200px; }
  #time-label { font-variant-numeric: tabular-nums; min-width: 12em; }
  .controls button, .controls select { border: 1px solid var(--line);
    background: var(--card); color: var(--ink); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; }
  #item-info { color: var(--sub); font-size: .8rem; margin-top: 8px; }
  #grid-view { display: none; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 12px; }
  #grid-view figure { margin: 0; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  #grid-view img { width: 100%; border-radius: 6px; background: #000; }
  #grid-view figcaption { font-size: .8rem; color: var(--sub); padding-top: 4px; }
  .note { color: var(--sub); font-size: .8rem; margin-top: 10px; }
</style>
</head>
<body>

-y0_00400.png", "00450": "contour-pressure-y0_00450.png", "00500": "contour-pressure-y0_00500.png", "final": "contour-pressure-y0_final.png"}}, {"id": "contour-dpm-y0", "title": "DPM濃度コンター(y=0断面)", "kind": "contour", "mode": "claude", "object": "cv_contour_dpm_y0", "range": {"min": 0.0, "max": 20.0, "log": false}, "status": "ok", "reason": "claude自動生成", "files": {"00050": "contour-dpm-y0_00050.png", "00100": "contour-dpm-y0_00100.png", "00150": "contour-dpm-y0_00150.png", "00200": "contour-dpm-y0_00200.png", "00250": "contour-dpm-y0_00250.png", "00300": "contour-dpm-y0_00300.png", "00350": "contour-dpm-y0_00350.png", "00400": "contour-dpm-y0_00400.png", "00450": "contour-dpm-y0_00450.png", "00500": "contour-dpm-y0_00500.png", "final": "contour-dpm-y0_final.png"}}, {"id": "contour-mach-y0", "title": "マッハ数コンター(y=0断面)", "kind": "contour", "mode": "claude", "object": "cv_contour_mach_y0", "range": {"min": 0.0, "max": 1.2, "log": false}, "status": "ok", "reason": "claude自動生成", "files": {"00050": "contour-mach-y0_00050.png", "00100": "contour-mach-y0_00100.png", "00150": "contour-mach-y0_00150.png", "00200": "contour-mach-y0_00200.png", "00250": "contour-mach-y0_00250.png", "00300": "contour-mach-y0_00300.png", "00350": "contour-mach-y0_00350.png", "00400": "contour-mach-y0_00400.png", "00450": "contour-mach-y0_00450.png", "00500": "contour-mach-y0_00500.png", "final": "contour-mach-y0_final.png"}}, {"id": "contour-velocity-z22", "title": "速度の大きさコンター(z=22mm断面)", "kind": "contour", "mode": "claude", "object": "cv_contour_velocity_z22", "range": {"min": 0.0, "max": 360.0, "log": false}, "status": "ok", "reason": "claude自動生成", "files": {"00050": "contour-velocity-z22_00050.png", "00100": "contour-velocity-z22_00100.png", "00150": "contour-velocity-z22_00150.png", "00200": "contour-velocity-z22_00200.png", "00250": "contour-velocity-z22_00250.png", "00300": "contour-velocity-z22_00300.png", "00350": "contour-velocity-z22_00350.png", "00400": "contour-velocity-z22_00400.png", "00450": "contour-velocity-z22_00450.png", "00500": "contour-velocity-z22_00500.png", "final": "contour-velocity-z22_final.png"}}, {"id": "contour-dpm-z22", "title": "DPM濃度コンター(z=22mm断面)", "kind": "contour", "mode": "claude", "object": "cv_contour_dpm_z22", "range": {"min": 0.0, "max": 20.0, "log": false}, "status": "ok", "reason": "claude自動生成", "files": {"00050": "contour-dpm-z22_00050.png", "00100": "contour-dpm-z22_00100.png", "00150": "contour-dpm-z22_00150.png", "00200": "contour-dpm-z22_00200.png", "00250": "contour-dpm-z22_00250.png", "00300": "contour-dpm-z22_00300.png", "00350": "contour-dpm-z22_00350.png", "00400": "contour-dpm-z22_00400.png", "00450": "contour-dpm-z22_00450.png", "00500": "contour-dpm-z22_00500.png", "final": "contour-dpm-z22_final.png"}}, {"id": "vector-velocity-y0", "title": "速度ベクトル(y=0断面)", "kind": "vector", "mode": "claude", "object": "cv_vector_velocity_y0", "range": {"min": 0.0, "max": 360.0, "log": false}, "status": "ok", "reason": "claude自動生成", "files": {"00050": "vector-velocity-y0_00050.png", "00100": "vector-velocity-y0_00100.png", "00150": "vector-velocity-y0_00150.png", "00200": "vector-velocity-y0_00200.png", "00250": "vector-velocity-y0_00250.png", "00300": "vector-velocity-y0_00300.png", "00350": "vector-velocity-y0_00350.png", "00400": "vector-velocity-y0_00400.png", "00450": "vector-velocity-y0_00450.png", "00500": "vector-velocity-y0_00500.png", "final": "vector-velocity-y0_final.png"}}, {"id": "pathline-inlet", "title": "パスライン(inlet起点)", "kind": "pathline", "mode": "manual", "object": "pathlines-1", "range": {"policy": "case", "min": null, "max": null, "log": false}, "status": "ok", "reason": "pathline が1個のみ → 無条件採用", "files": {"00050": "pathline-inlet_00050.png", "00100": "pathline-inlet_00100.png", "00150": "pathline-inlet_00150.png", "00200": "pathline-inlet_00200.png", "00250": "pathline-inlet_00250.png", "00300": "pathline-inlet_00300.png", "00350": "pathline-inlet_00350.png", "00400": "pathline-inlet_00400.png", "00450": "pathline-inlet_00450.png", "00500": "pathline-inlet_00500.png", "final": "pathline-inlet_final.png"}}, {"id": "particle-bed", "title": "粒子トラック(bed_injection)", "kind": "particle_track", "mode": "manual", "object": "particle-tracks-1", "range": {"policy": "case", "min": null, "max": null, "log": false}, "status": "ok", "reason": "particle_track が1個のみ → 無条件採用", "files": {"00050": "particle-bed_00050.png", "00100": "particle-bed_00100.png", "00150": "particle-bed_00150.png", "00200": "particle-bed_00200.png", "00250": "particle-bed_00250.png", "00300": "particle-bed_00300.png", "00350": "particle-bed_00350.png", "00400": "particle-bed_00400.png", "00450": "particle-bed_00450.png", "00500": "particle-bed_00500.png", "final": "particle-bed_final.png"}}]}</script>
<div class="wrap">
  <h1>Fluent時系列可視化レポート — 容器内混合デモ</h1>
  <div class="meta" id="meta"></div>
  <div class="tabs" id="tabs"></div>
  <div class="stage">
    <div class="imgbox">
      <img id="frame-img" alt="可視化フレーム" data-frame-index="0">
      <div id="missing">このフレームは未生成(描画失敗または未実行)</div>
    </div>
    <div class="controls">
      <button id="play">▶ 再生</button>
      <input type="range" id="slider" min="0" value="0">
      <span id="time-label"></span>
      <select id="speed">
        <option value="600">0.5x</option>
        <option value="300" selected>1x</option>
        <option value="150">2x</option>
      </select>
      <label><input type="checkbox" id="loop" checked> ループ</label>
      <button id="grid-toggle">グリッド比較</button>
    </div>
    <div id="item-info"></div>
  </div>
  <div id="grid-view"></div>
  <p class="note">←/→キーでフレーム送り。final は step 500(=1.0ms)と同時刻の
  データです。画像は ../output/post/viz/ 内のPNGを相対参照しています(HTMLはdocument/に配置)。</p>
</div>
<script>
"use strict";
const MF = JSON.parse(document.getElementById("manifest").textContent);
const PLACEHOLDER = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNsaGj4DwAFhAJ/Y2EBSgAAAABJRU5ErkJggg==";
const steps = MF.steps, items = MF.items;
window.__loadErrors = 0;

// 全フレームを事前プリロード(失敗数を playwright から検証可能にする)
for (const it of items)
  for (const label of Object.keys(it.files || {})) {
    const im = new Image();
    im.onerror = () => { window.__loadErrors++; };
    im.src = "../output/post/viz/" + it.files[label];
  }

let cur = { item: 0, frame: 0, timer: null };
const $ = id => document.getElementById(id);
const okItems = i => (i.status === "ok" && Object.keys(i.files || {}).length);

function fmtTime(s) {
  return `step ${s.step} = ${(s.time_us / 1000).toFixed(2)} ms` +
         (s.label === "final" ? " (final)" : "");
}

function render() {
  const it = items[cur.item], st = steps[cur.frame];
  const file = (it.files || {})[st.label];
  const img = $("frame-img");
  img.src = file ? "../output/post/viz/" + file : PLACEHOLDER;
  img.dataset.frameIndex = String(cur.frame);
  $("missing").style.display = file ? "none" : "flex";
  $("slider").value = String(cur.frame);
  $("time-label").textContent = fmtTime(st);
  $("item-info").textContent =
    `${it.title} | kind=${it.kind} mode=${it.mode}` +
    (it.object ? ` object=${it.object}` : "") +
    (it.range && it.range.min != null
      ? ` range=[${it.range.min}, ${it.range.max}]${it.range.log ? " log" : ""}`
      : "");
  document.querySelectorAll("#tabs button").forEach((b, i) =>
    b.classList.toggle("active", i === cur.item));
  renderGrid();
}

function renderGrid() {
  const gv = $("grid-view");
  if (gv.style.display === "none" || !gv.style.display) return;
  const st = steps[cur.frame];
  gv.innerHTML = "";
  for (const it of items) {
    if (!okItems(it)) continue;
    const file = (it.files || {})[st.label];
    const fig = document.createElement("figure");
    const im = document.createElement("img");
    im.src = file ? "../output/post/viz/" + file : PLACEHOLDER;
    const cap = document.createElement("figcaption");
    cap.textContent = `${it.title} — ${fmtTime(st)}`;
    fig.append(im, cap);
    gv.append(fig);
  }
}

function stop() {
  if (cur.timer) { clearInterval(cur.timer); cur.timer = null; }
  $("play").textContent = "▶ 再生";
}

function stepFrame(d) {
  let f = cur.frame + d;
  if ($("loop").checked) f = (f + steps.length) % steps.length;
  else if (f < 0 || f >= steps.length) { stop(); return; }
  cur.frame = f;
  render();
}

$("play").addEventListener("click", () => {
  if (cur.timer) { stop(); return; }
  $("play").textContent = "⏸ 停止";
  cur.timer = setInterval(() => stepFrame(1), Number($("speed").value));
});
$("speed").addEventListener("change", () => {
  if (cur.timer) { stop(); $("play").click(); }
});
$("slider").addEventListener("input", e => {
  cur.frame = Number(e.target.value); render();
});
$("grid-toggle").addEventListener("click", () => {
  const gv = $("grid-view");
  gv.style.display = (gv.style.display === "grid") ? "none" : "grid";
  renderGrid();
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") stepFrame(1);
  if (e.key === "ArrowLeft") stepFrame(-1);
});

// タブ生成
const tabs = $("tabs");
items.forEach((it, i) => {
  const b = document.createElement("button");
  b.textContent = it.title;
  b.dataset.itemId = it.id;
  if (!okItems(it)) {
    b.classList.add("unmatched");
    b.title = it.reason || "未生成";
  }
  b.addEventListener("click", () => { cur.item = i; render(); });
  tabs.append(b);
});

$("slider").max = String(steps.length - 1);
$("meta").textContent =
  `case: ${MF.case} | dt=${MF.dt_us}µs | ${steps.length}時刻 | ` +
  `項目: ${items.filter(okItems).length}/${items.length}`;
cur.item = Math.max(0, items.findIndex(okItems));
render();
</script>
</body>
</html>
